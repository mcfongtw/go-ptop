name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: ['1.21', '1.22']

    steps:
      # 1) Grab the code
      - uses: actions/checkout@v4

      # 2) Set up Go with built-in caching
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      # 3) Create build directory
      - name: Create build directory
        run: mkdir -p build

      # 4) Install gotestsum for nicer output & JUnit XML
      - name: Install gotestsum
        run: |
          GO111MODULE=on go install gotest.tools/gotestsum@latest

      # 5) Run go vet to check for code issues
      - name: Run go vet
        run: go vet ./...

      # 6) Build application
      - name: Build
        run: go build -o build/go-ptop

      # 7) Run unit tests with coverage and JUnit output (CI GATE)
      - name: Run unit tests & collect coverage
        run: |
          gotestsum \
            --jsonfile build/unit-tests-results.json \
            --junitfile build/unit-tests-results.xml \
            -- \
            -race \
            -tags=unit \
            -coverprofile=build/unit-tests-coverage.out \
            -covermode=atomic \
            ./...

      # 8) Annotate test results in GitHub
      - name: Test Report
        uses: dorny/test-reporter@v2.1.0
        if: ${{ !cancelled() }}
        with:
          name: unit-tests-${{ matrix.go-version }}
          path: build/unit-tests-results.json
          reporter: golang-json

      # 9) Upload test results to Codecov
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: build/unit-tests-results.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      # 10) Upload coverage to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: success()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: mcfongtw/go-ptop
          files: build/unit-tests-coverage.out
          flags: unit-tests
          name: unit-tests-coverage-${{ matrix.go-version }}
          fail_ci_if_error: false
